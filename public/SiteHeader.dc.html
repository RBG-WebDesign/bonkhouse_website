<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body class="bh-site">
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Covered+By+Your+Grace&amp;family=Special+Elite&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/bonkhouse.css">
<link rel="stylesheet" href="/site-header.css">
</helmet>
<header class="bh-header" ref="{{ setHeader }}">
  <div class="bh-header-inner">
    <a class="bh-header-home" href="/">
      <img class="bh-header-logo" alt="Sunday Afternoon Bonk House" src="public/bonkhouse-title.webp">
    </a>
    <div class="bh-header-actions">
      <nav class="bh-header-nav" aria-label="Main navigation">
        <a class="bh-header-link" href="/screenings" aria-current="{{ screeningsCurrent }}">Screenings</a>
        <a class="bh-header-link" href="/about" aria-current="{{ aboutCurrent }}">About</a>
      </nav>
      <a class="bh-header-cta bh-header-cta--standalone" href="{{ ctaHref }}" onClick="{{ closeMenu }}">{{ ctaLabel }}
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </a>
      <button class="bh-header-toggle" type="button" aria-label="{{ menuLabel }}" aria-expanded="{{ menuOpen }}" aria-controls="{{ menuId }}" onClick="{{ toggleMenu }}">
        <sc-if value="{{ menuClosed }}" hint-placeholder-val="{{ true }}">
          <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
        </sc-if>
        <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
          <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </sc-if>
      </button>
      <nav class="bh-header-menu" id="{{ menuId }}" aria-label="Site menu" hidden="{{ menuClosed }}">
        <a class="bh-header-link" href="/screenings" aria-current="{{ screeningsCurrent }}" onClick="{{ closeMenu }}">Screenings</a>
        <a class="bh-header-link" href="/about" aria-current="{{ aboutCurrent }}" onClick="{{ closeMenu }}">About</a>
        <a class="bh-header-cta" href="{{ ctaHref }}" onClick="{{ closeMenu }}">{{ ctaLabel }}
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        </a>
      </nav>
    </div>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:96},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;screenings&quot;,&quot;about&quot;],&quot;section&quot;:&quot;Header&quot;},&quot;ctaHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Header&quot;},&quot;ctaLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Header&quot;}}">
// A page can pin the CTA with cta-href / cta-label, such as its RSVP form.
class Component extends DCLogic {
  state = { loaded: false, cur: null, menuOpen: false };
  menuId = "bh-site-menu-" + Math.random().toString(36).slice(2);
  setHeader = (element) => { this.header = element; };
  closeMenu = () => {
    if (this.state.menuOpen) this.setState({ menuOpen: false });
  };
  onKeyDown = (event) => {
    if (event.key === "Escape" && this.state.menuOpen) {
      this.closeMenu();
      this.header?.querySelector(".bh-header-toggle")?.focus();
    }
  };
  onOutsideInteraction = (event) => {
    if (!this.header?.querySelector(".bh-header-actions")?.contains(event.target)) this.closeMenu();
  };
  onBreakpointChange = (event) => {
    if (event.matches) this.closeMenu();
  };
  componentDidMount() {
    this.mounted = true;
    document.addEventListener("keydown", this.onKeyDown);
    document.addEventListener("pointerdown", this.onOutsideInteraction);
    document.addEventListener("focusin", this.onOutsideInteraction);
    this.desktop = window.matchMedia("(min-width: 900px)");
    this.desktop.addEventListener("change", this.onBreakpointChange);
    import("/events.js")
      .then((m) => m.splitEvents())
      .then(({ current }) => {
        if (this.mounted) this.setState({ loaded: true, cur: current });
      })
      .catch(() => {
        // Keep the screening index as a useful fallback when data is unavailable.
      });
  }
  componentWillUnmount() {
    this.mounted = false;
    document.removeEventListener("keydown", this.onKeyDown);
    document.removeEventListener("pointerdown", this.onOutsideInteraction);
    document.removeEventListener("focusin", this.onOutsideInteraction);
    this.desktop?.removeEventListener("change", this.onBreakpointChange);
  }
  renderVals() {
    const active = this.props.active ?? "none";
    const { cur, loaded, menuOpen } = this.state;
    return {
      screeningsCurrent: active === "screenings" ? "page" : undefined,
      aboutCurrent: active === "about" ? "page" : undefined,
      ctaHref: this.props.ctaHref || (cur ? cur.href : loaded ? "/#list" : "/screenings"),
      ctaLabel: this.props.ctaLabel || (cur || !loaded ? "RSVP" : "JOIN THE LIST"),
      menuOpen,
      menuClosed: !menuOpen,
      menuLabel: menuOpen ? "Close menu" : "Open menu",
      menuId: this.menuId,
      setHeader: this.setHeader,
      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen }),
      closeMenu: this.closeMenu
    };
  }
}
</script>
</body>
</html>
