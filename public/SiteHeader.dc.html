<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Covered+By+Your+Grace&amp;family=Special+Elite&amp;display=swap" rel="stylesheet">
<style>
[data-m="burger"]{display:none}
@media (max-width:899px){[data-m="nav"]{display:none!important}[data-m="burger"]{display:inline-flex!important}}
@media (max-width:767px){[data-m="hpad"]{padding:0 16px!important}[data-m="cta"]{display:none!important}}
</style>
</helmet>
<header style="position:relative;border-bottom:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.9);backdrop-filter:blur(24px);box-shadow:inset 0 -1px 0 rgba(155,38,21,.45),0 8px 24px rgba(0,0,0,.5)">
  <div style="position:absolute;left:0;right:0;bottom:-1px;height:2px;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(177,38,21,.8) 12%,rgba(255,212,0,.35) 50%,rgba(177,38,21,.8) 88%,transparent);opacity:.65"></div>
  <div style="position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:80px;max-width:1280px;margin:0 auto;padding:0 32px" data-m="hpad">
    <a href="/" style="display:block;flex:0 1 auto;min-width:0">
      <img alt="Sunday Afternoon Bonk House" src="public/bonkhouse-title.webp" style="display:block;height:52px;width:auto;filter:sepia(.16) contrast(1.1) drop-shadow(1px 1px 0 rgba(132,22,13,.5))">
    </a>
    <div style="display:flex;align-items:center;gap:32px">
      <nav data-m="nav" style="display:flex;align-items:center;gap:32px">
        <a href="/screenings" style="display:inline-flex;height:44px;align-items:center;font-family:'Bebas Neue',Impact,sans-serif;font-size:24px;letter-spacing:.05em;text-transform:uppercase;color:{{ screeningsColor }}" style-hover="color:#ffd400">Screenings</a>
        <a href="/about" style="display:inline-flex;height:44px;align-items:center;font-family:'Bebas Neue',Impact,sans-serif;font-size:24px;letter-spacing:.05em;text-transform:uppercase;color:{{ aboutColor }}" style-hover="color:#ffd400">About</a>
      </nav>
      <a data-m="cta" href="{{ ctaHref }}" style="position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border:1px solid #ffd400;border-radius:3px;background:#ffd400;color:#000;font-family:'Bebas Neue',Impact,sans-serif;font-size:24px;letter-spacing:.05em;line-height:1;text-transform:uppercase;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -8px 18px rgba(83,51,0,.14),0 8px 22px rgba(0,0,0,.32),0 0 26px rgba(255,212,0,.18)" style-hover="background:#ffe15a;transform:translateY(-2px)">{{ ctaLabel }}
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </a>
      <button data-m="burger" type="button" aria-label="{{ menuLabel }}" aria-expanded="{{ menuOpen }}" onClick="{{ toggleMenu }}" style="align-items:center;justify-content:center;width:48px;height:48px;padding:0;border:1px solid rgba(255,212,0,.5);border-radius:3px;background:rgba(0,0,0,.4);color:#ffd400;cursor:pointer">
        <sc-if value="{{ menuClosed }}" hint-placeholder-val="{{ true }}">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
        </sc-if>
        <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </sc-if>
      </button>
    </div>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <nav data-m="menu" aria-label="Site menu" style="position:absolute;left:0;right:0;top:100%;z-index:60;display:flex;flex-direction:column;gap:4px;padding:12px 16px 20px;border-top:1px solid rgba(255,255,255,.12);border-bottom:1px solid rgba(255,212,0,.35);background:rgba(0,0,0,.96);backdrop-filter:blur(24px);box-shadow:0 18px 40px rgba(0,0,0,.6)">
      <a href="/screenings" onClick="{{ closeMenu }}" style="display:flex;align-items:center;min-height:56px;padding:0 8px;border-bottom:1px solid rgba(255,255,255,.1);font-family:'Bebas Neue',Impact,sans-serif;font-size:30px;letter-spacing:.05em;text-transform:uppercase;color:{{ screeningsColor }}">Screenings</a>
      <a href="/about" onClick="{{ closeMenu }}" style="display:flex;align-items:center;min-height:56px;padding:0 8px;border-bottom:1px solid rgba(255,255,255,.1);font-family:'Bebas Neue',Impact,sans-serif;font-size:30px;letter-spacing:.05em;text-transform:uppercase;color:{{ aboutColor }}">About</a>
      <a href="{{ ctaHref }}" onClick="{{ closeMenu }}" style="display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;margin-top:12px;border:1px solid #ffd400;border-radius:3px;background:#ffd400;color:#000;font-family:'Bebas Neue',Impact,sans-serif;font-size:26px;letter-spacing:.05em;text-transform:uppercase;box-shadow:0 0 26px rgba(255,212,0,.18)">{{ ctaLabel }}
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </a>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:96},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;screenings&quot;,&quot;about&quot;],&quot;section&quot;:&quot;Header&quot;},&quot;ctaHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Header&quot;},&quot;ctaLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Header&quot;}}">
// The RSVP button follows the current screening. A page can still pin it
// with cta-href / cta-label (the event page points it at its own form).
// Under 900px the nav collapses into a hamburger menu (top right).
class Component extends DCLogic {
  state = { loaded: false, cur: null, menuOpen: false };
  componentDidMount() {
    import("/events.js").then((m) => m.splitEvents()).then(({ current }) => this.setState({ loaded: true, cur: current }));
  }
  renderVals() {
    const active = this.props.active ?? "none";
    const c = (name) => (active === name ? "#ffd400" : "#fff");
    const { cur, loaded, menuOpen } = this.state;
    // Stay on "RSVP" until the data is in, so the button never flashes.
    return {
      screeningsColor: c("screenings"),
      aboutColor: c("about"),
      ctaHref: this.props.ctaHref || (cur ? cur.href : loaded ? "/#list" : "/screenings"),
      ctaLabel: this.props.ctaLabel || (cur || !loaded ? "RSVP" : "JOIN THE LIST"),
      menuOpen,
      menuClosed: !menuOpen,
      menuLabel: menuOpen ? "Close menu" : "Open menu",
      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen }),
      closeMenu: () => this.setState({ menuOpen: false })
    };
  }
}
</script>
</body>
</html>
