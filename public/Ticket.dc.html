<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body class="bh-site">
<x-dc>
<helmet>
<link rel="stylesheet" href="/bonkhouse.css">
<link rel="stylesheet" href="/site-header.css">
<link rel="stylesheet" href="/archive.css">
</helmet>
<!-- Shared current-screening ticket for the homepage and screening index. -->
<a class="bh-ticket" data-m="ticket" href="{{ href }}" aria-label="{{ ticketLabel }}" aria-busy="{{ loading }}">
  <div class="bh-ticket-punch bh-ticket-punch--left" aria-hidden="true"></div>
  <div class="bh-ticket-punch bh-ticket-punch--right" aria-hidden="true"></div>
  <div class="bh-ticket-tape bh-ticket-tape--top-left" aria-hidden="true"></div>
  <div class="bh-ticket-tape bh-ticket-tape--top-right" aria-hidden="true"></div>
  <div class="bh-ticket-tape bh-ticket-tape--bottom-left" aria-hidden="true"></div>
  <div class="bh-ticket-tape bh-ticket-tape--bottom-right" aria-hidden="true"></div>
  <div class="bh-ticket-grain" aria-hidden="true"></div>
  <div class="bh-ticket-border" aria-hidden="true"></div>

  <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}">
    <p class="bh-ticket-status" role="status">Loading the next screening...</p>
  </sc-if>
  <sc-if value="{{ unavailable }}" hint-placeholder-val="{{ false }}">
    <div class="bh-ticket-status">
      <p>{{ unavailableLabel }}</p>
      <span>See all screenings</span>
    </div>
  </sc-if>
  <sc-if value="{{ hasCurrent }}" hint-placeholder-val="{{ true }}">
    <div class="bh-ticket-stub" data-m="ticketstub">
      <span class="bh-ticket-admit" data-m="tickettext">Admit one · Sunday</span>
      <div class="bh-ticket-date" aria-label="{{ dateLong }}">
        <span class="bh-ticket-month">{{ mon }}</span>
        <span class="bh-ticket-day">{{ day }}</span>
        <span class="bh-ticket-number">No. {{ no }}</span>
      </div>
      <div class="bh-ticket-divider" data-m="ticketdiv" aria-hidden="true"></div>
    </div>

    <div class="bh-ticket-body" data-m="ticketbody">
      <div class="bh-ticket-program">
        <p class="bh-ticket-eyebrow">{{ eyebrow }}</p>
        <sc-if value="{{ hasLogo }}" hint-placeholder-val="{{ true }}">
          <div class="bh-ticket-logo">
            <img alt="{{ title }}" src="{{ logo }}" onError="{{ logoFailed }}" style="width:{{ logoW }};margin:{{ logoM }}">
          </div>
        </sc-if>
        <sc-if value="{{ noLogo }}" hint-placeholder-val="{{ false }}">
          <h3 class="bh-ticket-title bh-ticket-title--main">{{ title }}</h3>
        </sc-if>
        <sc-if value="{{ showShortTitle }}" hint-placeholder-val="{{ true }}">
          <h3 class="bh-ticket-title">{{ shortTitle }}</h3>
        </sc-if>
        <sc-if value="{{ hasBadge }}" hint-placeholder-val="{{ true }}">
          <div class="bh-ticket-badge-wrap">
            <span class="bh-ticket-badge">{{ badge }}</span>
          </div>
        </sc-if>
      </div>
      <div class="bh-ticket-meta" data-m="ticketmeta">
        <span>TIME: {{ timeLabel }}</span>
        <span class="bh-ticket-barcode" aria-hidden="true"></span>
        <span>VENUE: {{ venueShort }}</span>
      </div>
    </div>
  </sc-if>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:360}}">
class Component extends DCLogic {
  state = { loaded: false, ok: true, cur: null, logoBroken: false };
  async componentDidMount() {
    this.mounted = true;
    try {
      const m = await import("/events.js");
      const { ok, current } = await m.splitEvents();
      if (this.mounted) this.setState({ loaded: true, ok, cur: current });
    } catch {
      if (this.mounted) this.setState({ loaded: true, ok: false });
    }
  }
  componentWillUnmount() {
    this.mounted = false;
  }
  renderVals() {
    const c = this.state.cur || {};
    const hasLogo = !!c.logo && !this.state.logoBroken;
    return {
      loading: !this.state.loaded,
      unavailable: this.state.loaded && !this.state.cur,
      unavailableLabel: this.state.ok ? "The next screening is on its way." : "The screening could not load.",
      hasCurrent: !!this.state.cur,
      ticketLabel: c.title ? c.title + (c.dateLong ? ", " + c.dateLong : "") + ". View screening details." : "See all screenings",
      href: c.href ?? "/screenings",
      title: c.title ?? "",
      eyebrow: c.eyebrow ?? "",
      hasLogo,
      noLogo: !hasLogo,
      logo: c.logo ?? "",
      logoW: c.logoW ?? "100%",
      logoM: c.logoM ?? "0",
      logoFailed: () => this.setState({ logoBroken: true }),
      shortTitle: c.shortTitle ?? "",
      showShortTitle: !!c.shortTitle && (hasLogo || c.shortTitle !== c.title),
      hasBadge: !!c.badge,
      badge: c.badge ?? "",
      dateLong: c.dateLong ?? "",
      mon: c.mon ?? "",
      day: c.day ?? "",
      no: c.no ?? "",
      timeLabel: c.timeLabel ?? "",
      venueShort: c.venueShort ?? ""
    };
  }
}
</script>
</body>
</html>
