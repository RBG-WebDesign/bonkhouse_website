[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_SUPABASE_URL = "https://nwnxoqrmqsjyznegykfc.supabase.co"
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_FJGSI523nOCGZ6JuZSjBsg_1wnLTCma"
  NEXT_PUBLIC_SITE_URL = "https://sundaybonkhouse.netlify.app"
  RESEND_FROM = "Sunday Afternoon Bonkhouse <tickets@bonkhouse.com>"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Serve the static design-canvas pages at the CDN edge; the Next server
# function can't resolve public/ files through next.config rewrites.
[[redirects]]
  from = "/"
  to = "/home.dc.html"
  status = 200
  force = true

[[redirects]]
  from = "/screenings"
  to = "/screenings.dc.html"
  status = 200
  force = true

[[redirects]]
  from = "/events/society-videodrome-double-feature"
  to = "/society-videodrome-screening.dc.html"
  status = 200
  force = true
