[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_SUPABASE_URL = "https://nwnxoqrmqsjyznegykfc.supabase.co"
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_FJGSI523nOCGZ6JuZSjBsg_1wnLTCma"
  NEXT_PUBLIC_SITE_URL = "https://bonkhouse.com"
  RESEND_FROM = "Sunday Afternoon Bonkhouse <tickets@bonkhouse.com>"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Serve the static design-canvas pages at the CDN edge; the Next server
# function can't resolve public/ files through next.config rewrites.
# Every screening, past or present, is rendered by the one event page from
# its /events/<slug> URL — no per-movie rules needed.
[[redirects]]
  from = "/"
  to = "/home.dc.html"
  status = 200
  force = true

[[redirects]]
  from = "/screenings"
  to = "/screenings.dc.html"
  status = 200
  force = true

[[redirects]]
  from = "/events/*"
  to = "/event.dc.html"
  status = 200
  force = true
